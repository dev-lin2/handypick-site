<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root { --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b665e; --line: #e4e0d8; --accent: #8a5a1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141311; --fg: #ece8e1; --muted: #a39d93; --line: #2c2a26; --accent: #e0a85a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  header a { color: var(--fg); text-decoration: none; font-weight: 700; letter-spacing: .02em; }
  main { padding-top: 12px; padding-bottom: 40px; }
  h1 { font-size: 1.8rem; line-height: 1.25; margin: 1.2em 0 .4em; }
  h2 { font-size: 1.25rem; margin: 1.8em 0 .4em; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin: 1em 0; display: block; overflow-x: auto; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  footer { padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header><a href="/">Handypick</a></header>
<main>
{{ content }}
</main>
<footer>&copy; {{ site.time | date: "%Y" }} Handypick &middot; <a href="mailto:support@handypick.dev">support@handypick.dev</a></footer>
</body>
</html>
